name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Install Dependencies
        run: |
          npm install

      - name: Build Web App
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Patch AGP Version in All Gradle Files
        run: |
          node scripts/patch-agp.js

      - name: Setup Android SDK Environment & Licenses
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          mkdir -p /usr/local/lib/android/sdk/licenses
          printf "2433370230631372502804300305886f345513d8\n84831b9409646a918e30573bab4c9c91346d8abd\nd975465961bed804676be67376f23aea4b417128\ne96725b30306157f978203398309291a4a27072a" > /usr/local/lib/android/sdk/licenses/android-sdk-license || true
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Build Debug APK via Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoMiner-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
